[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-triage-agent"
version = "0.1.0"
description = "Classifies failing GitHub Actions runs, evaluated offline against ci-triage-lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The LLM baselines (D6): imported lazily, so the rest of the package and CI need none of it.
llm = ["google-genai>=2.0", "ollama>=0.5", "tzdata"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
